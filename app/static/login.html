<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2b705">
  <title>학원 코드 입력</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="wrap" style="max-width:480px">
    <header class="top">
      <div>
        <h1>하원 셔틀</h1>
        <p class="sub">이 기기에서 처음 한 번만 학원 코드를 입력하면 됩니다.</p>
      </div>
    </header>
    <form class="card" id="form" novalidate>
      <div class="field">
        <label class="label" for="code">학원 코드</label>
        <input class="input" id="code" name="code" type="password" autocomplete="current-password" inputmode="text" required autofocus>
      </div>
      <div class="field">
        <button class="btn primary big" type="submit" id="submit">들어가기</button>
      </div>
      <p class="notice err" id="error" role="alert" hidden></p>
    </form>
    <p class="muted small">코드는 원장님께 받을 수 있어요.</p>
  </main>

  <script type="module">
    import { post } from "/static/common.js";

    const params = new URLSearchParams(location.search);
    const raw = params.get("next") || "/";
    // Only go back to a page on this site.
    const next = raw.startsWith("/") && !raw.startsWith("//") ? raw : "/";
    const err = document.getElementById("error");
    const input = document.getElementById("code");

    const login = async (code) => {
      document.getElementById("submit").disabled = true;
      try {
        await post("/api/login", { code });
        location.replace(next);
      } catch (e) {
        err.textContent = e.message;
        err.hidden = false;
        input.select();
      } finally {
        document.getElementById("submit").disabled = false;
      }
    };

    document.getElementById("form").addEventListener("submit", (ev) => {
      ev.preventDefault();
      if (input.value.trim()) login(input.value.trim());
    });

    // A setup link may carry the code; use it once and take it out of the address bar.
    const linked = params.get("code");
    if (linked) {
      params.delete("code");
      history.replaceState(null, "", `/login?${params.toString()}`);
      login(linked);
    }
  </script>
</body>
</html>
