<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2b705">
  <title>하원 셔틀</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>하원 셔틀</h1>
        <p class="sub">셔틀을 부르면, 운행 순서는 배차 엔진이 정합니다.</p>
      </div>
      <div class="chips">
        <span id="mode" class="chip">연결 중…</span>
        <span id="clock" class="chip clock">--:--</span>
      </div>
    </header>

    <div class="strip" aria-live="polite"><span class="van" aria-hidden="true"></span><span id="vehicle">셔틀 위치를 불러오는 중…</span></div>

    <section aria-labelledby="teachers">
      <h2 id="teachers" class="label" style="margin:0 0 8px">선생님</h2>
      <div class="roles" id="branches"></div>
    </section>

    <section aria-labelledby="others">
      <h2 id="others" class="label" style="margin:0 0 8px">기사님 · 원장님</h2>
      <div class="roles">
        <a class="role" href="/driver">
          <strong><span class="tag" style="background:var(--accent)"></span>기사님 화면</strong>
          <span>다음에 갈 곳과 태울 학생을 한 줄로 안내합니다.</span>
        </a>
        <a class="role" href="/board">
          <strong><span class="tag" style="background:var(--ink-2)"></span>현황판</strong>
          <span>셔틀 위치, 기다리는 학생, 오늘의 대기 시간을 봅니다.</span>
        </a>
      </div>
    </section>
  </main>

  <script type="module">
    import { connect, getJSON, h, renderTop, vehicleLine } from "/static/common.js";

    const config = await getJSON("/api/config");
    const names = Object.fromEntries(config.stops.map((s) => [s.id, s]));
    document.getElementById("branches").replaceChildren(
      ...config.branches.map((b) =>
        h("a", { class: "role", href: `/teacher?branch=${encodeURIComponent(b.id)}` },
          h("strong", {}, h("span", { class: "tag", style: "background:var(--academy)" }), `${b.name} · ${b.level}`),
          h("span", {}, `셔틀 부르기 · ${b.destinations.map((d) => names[d].short).join(" ")}`),
        ),
      ),
    );

    connect((state) => {
      renderTop(state);
      document.getElementById("vehicle").textContent = `셔틀 · ${vehicleLine(state)}`;
    });
  </script>
</body>
</html>
