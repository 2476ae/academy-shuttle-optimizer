<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR','Nanum Gothic',sans-serif" role="img" aria-labelledby="t d">
<title id="t">학원과 하원 목적지 배치 개념도</title>
<desc id="d">학원 A와 목적지 2는 북쪽에, 학원 B·C와 목적지 3·4는 남동쪽에 모여 있고, 목적지 1은 서쪽으로 멀리 떨어져 있다. 차로 A와 B·C 사이는 4~6분, 각 학원에서 목적지 1까지는 약 10분이다.</desc>
